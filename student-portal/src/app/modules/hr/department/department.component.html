<div class="container mt-4">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <p class="mb-0">Overview of all active Department.</p>

    <button class="btn btn-primary" (click)="addDepartment()">
      + Add Department
    </button>
  </div>

  <!-- Table -->
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Code</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      @for (department of departments; track $index) {
        <tr>
          <td>{{ department.id }}</td>
          <td>{{ department.name }}</td>
          <td>{{ department.code }}</td>
          <td>
            <i class="bi bi-pencil-square pointer me-3 icon-blue" (click)="editDepartment(department)">Edit</i>
            <i class="bi bi-trash pointer text-danger" (click)="deleteDepartment(department.id)">Delete</i>
          </td>
        </tr>
      }
    </tbody>
  </table>

</div>

<!-- MODERN MODAL -->
@if (isModalOpen) {
  <div class="modal d-block fade show"
       tabindex="-1"
       style="background: rgba(0,0,0,0.5);">

    <div class="modal-dialog">

      <div class="modal-content">

        <!-- Header -->
        <div class="modal-header">
          <h5 class="modal-title">Add Department</h5>
          <button class="btn-close" (click)="isModalOpen = false"></button>
        </div>

        <!-- Body -->
        <div class="modal-body">

          <form [formGroup]="deptForm" (ngSubmit)="saveDepartment()">

            <div class="mb-3">
              <label class="form-label">Code</label>
              <input class="form-control" formControlName="code"[ngClass]="{'is-invalid': deptForm.get('code')?.invalid && (deptForm.get('code')?.touched || deptForm.get('code')?.dirty)}">
              <div class="invalid-feedback">
                Please provide a valid code.
              </div>
            </div>
            
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input class="form-control" formControlName="name" [ngClass]="{'is-invalid': deptForm.get('name')?.invalid && (deptForm.get('name')?.touched || deptForm.get('name')?.dirty) }">
              <div class="invalid-feedback">
                Please provide a valid name.
              </div>
            </div>

            <button class="btn btn-primary w-100"
                    type="submit"
                    [disabled]="deptForm.invalid">
              Save
            </button>

          </form>

        </div>

      </div>

    </div>
  </div>
}
